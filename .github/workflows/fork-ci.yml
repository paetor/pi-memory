name: Fork CI
on:
  push:
    branches: [account-routing]
  pull_request:
    branches: [account-routing]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PI_MEMORY_PROVIDER_TESTS: '0'
      PI_MEMORY_QMD_TESTS: '0'
      PI_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install reviewed dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run fork checks
        run: npm run check
      - name: Check distributable package
        run: npm pack --dry-run --ignore-scripts
